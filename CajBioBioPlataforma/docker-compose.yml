services:
  mysql:
    image: mysql:8.4
    container_name: caj-mysql
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootdev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-caj_practicas}
      MYSQL_USER: ${MYSQL_USER:-caj}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cajdev}
    ports:
      - "3307:3306"
    volumes:
      - caj-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:5
    container_name: caj-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  caj-mysql-data:
